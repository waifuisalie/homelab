global:
  scrape_interval:     60s
  evaluation_interval: 60s

rule_files:
  - "alert_rules.yml"

storage:
  tsdb:
    retention:
      time: 15d
      size: 10GB
  

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
